name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck-and-js-tests:
    name: Typecheck + Vitest (TS/JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run JS/TS tests (vitest)
        run: pnpm -r --if-present run test -- --run

  python-tests:
    name: Pytest (agente Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest

      # Não bloqueante de propósito: rede fora do ar no runner do GitHub não
      # diz nada sobre a saúde das fontes em produção, e barrar o CI por isso
      # treinaria todo mundo a ignorar o passo. O valor está no relatório no
      # log — um "source_used" diferente de yfinance aqui é o aviso de que o
      # Yahoo mudou algo.
      - name: Preflight das fontes de dado (informativo)
        continue-on-error: true
        working-directory: artifacts/api-server/src
        run: python -m agent.provider_preflight
