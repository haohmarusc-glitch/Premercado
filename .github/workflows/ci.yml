name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ── Varredura de segredo ────────────────────────────────────────────────
  #
  # BLOQUEANTE de propósito, diferente do preflight lá embaixo. O preflight
  # informa sobre o mundo externo, que pode estar fora do ar sem culpa nossa;
  # este aqui olha só o nosso diff, e uma credencial no diff é sempre defeito
  # nosso.
  #
  # Quatro vazamentos até aqui (#257, #377, #409 e um em 28/08), cada um por
  # um caminho novo. `mask_sensitive_data` cobre os quatro em runtime, mas ela
  # roda depois que o segredo já está no processo -- e caminho novo nasce sem
  # máscara. Isto pega antes de entrar no histórico, onde máscara nenhuma
  # alcança.
  segredos:
    name: Varredura de segredo (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico completo: num PR interessa o que os commits DELE
          # introduzem, e com `fetch-depth: 1` não há com o que comparar.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          # Explícito de propósito. A action acha o .gitleaks.toml da raiz
          # sozinha, mas se alguém mover o arquivo ela cai calada no ruleset
          # padrão -- que não conhece o formato de chave da FMP nem da Alpha
          # Vantage, justo as duas que já vazaram aqui.
          GITLEAKS_CONFIG: .gitleaks.toml

  typecheck-and-js-tests:
    name: Typecheck + Vitest (TS/JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run JS/TS tests (vitest)
        run: pnpm -r --if-present run test -- --run

  python-tests:
    name: Pytest (agente Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Antes do pytest: lint que falha é barato de ler, e teste que falha
      # por causa de import morto custa uma leitura de stack.
      #
      # O ruleset está escolhido em ruff.toml, e o que ele NÃO checa é tão
      # deliberado quanto o que checa -- rodar o padrão devolve 189 achados,
      # dos quais 7 são defeito. Checagem que reprova código correto ensina
      # todo mundo a ignorá-la, e foi por isso que este repo passou três meses
      # sem lint nenhum.
      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check artifacts

      - name: Run pytest
        run: pytest

      # Não bloqueante de propósito: rede fora do ar no runner do GitHub não
      # diz nada sobre a saúde das fontes em produção, e barrar o CI por isso
      # treinaria todo mundo a ignorar o passo. O valor está no relatório no
      # log — um "source_used" diferente de yfinance aqui é o aviso de que o
      # Yahoo mudou algo.
      - name: Preflight das fontes de dado (informativo)
        continue-on-error: true
        working-directory: artifacts/api-server/src
        run: python -m agent.provider_preflight
